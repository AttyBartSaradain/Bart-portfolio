<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SM PRIME Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 70px;
    background: #111;
    color: white;
    padding: 10px 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    overflow-y: auto;
}

.sidebar h2 {
    font-size: 11px;
    text-align: center;
    margin: 0 0 10px 0;
    color: #ddd;
}

/* CIRCULAR BUTTONS */
.menu-item {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #222;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 14px;
    font-weight: bold;
    border: 1px solid #444;
    user-select: none;
}

.menu-item:hover {
    background: #0078ff;
    transform: scale(1.08);
    border-color: #4da3ff;
}

/* MAIN AREA */
.main {
    flex: 1;
    position: relative;
    background: black;
}

/* COVER IMAGE */
.cover {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background-color: black;
}

/* CONTENT */
.content {
    position: relative;
    z-index: 2;
    height: 100%;
    overflow-y: auto;
    padding: 20px;
    background: rgba(255,255,255,0.95);
    display: none;
    box-sizing: border-box;
}

/* EXIT BUTTON */
.close-btn {
    background: #d32f2f;
    color: white;
    padding: 8px 14px;
    border: none;
    cursor: pointer;
    border-radius: 5px;
    margin-bottom: 10px;
    font-weight: bold;
}

.close-btn:hover {
    background: #b71c1c;
}

/* IMAGES */
img {
    width: 100%;
    margin-bottom: 10px;
    border-radius: 6px;
}

/* PDF */
iframe {
    width: 100%;
    height: 600px;
    margin-bottom: 20px;
    border: none;
}

/* VIDEO */
video {
    width: 100%;
}

/* MOBILE */
@media (max-width: 768px) {
    .sidebar {
        width: 60px;
    }

    .menu-item {
        width: 40px;
        height: 40px;
        font-size: 12px;
    }

    iframe {
        height: 500px;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>DOCS</h2>

    <div class="menu-item" title="Endorsement" onclick="loadContent('A')">A</div>
    <div class="menu-item" title="Nomination" onclick="loadContent('B')">B</div>
    <div class="menu-item" title="Summary" onclick="loadContent('C')">C</div>
    <div class="menu-item" title="IPCR" onclick="loadContent('D')">D</div>
    <div class="menu-item" title="Clearances" onclick="loadContent('E')">E</div>
    <div class="menu-item" title="Accomplishments" onclick="loadContent('F')">F</div>
    <div class="menu-item" title="Awards" onclick="loadContent('G')">G</div>
    <div class="menu-item" title="Innovation" onclick="loadContent('H')">H</div>
    <div class="menu-item" title="Community" onclick="loadContent('I')">I</div>
    <div class="menu-item" title="Supporting Docs" onclick="loadContent('J')">J</div>
    <div class="menu-item" title="Video" onclick="loadContent('K')">K</div>
</div>

<!-- MAIN -->
<div class="main">

    <img src="assets/cover.jpg" class="cover" alt="Portfolio Cover">

    <div id="content" class="content">
        <button class="close-btn" onclick="clearContent()">EXIT</button>
        <div id="viewer"></div>
    </div>

</div>

<script>
function loadContent(section) {
    let content = "";

    if (section === "A") {
        for (let i = 1; i <= 3; i++) {
            content += `<img src="assets/A/${i}.jpg" alt="Endorsement ${i}">`;
        }
    }

    if (section === "B") {
        content += `<iframe src="assets/B/file.pdf"></iframe>`;
    }

    if (section === "C") {
        content += `<iframe src="assets/C/file.pdf"></iframe>`;
    }

    if (section === "D") {
        content += `<iframe src="assets/D/file.pdf"></iframe>`;
    }

    if (section === "E") {
        content += `<img src="assets/E/1.jpg" alt="Clearance">`;
    }

    if (section === "F") {
        content += `<iframe src="assets/F/F.pdf"></iframe>`;
    }

    if (section === "G") {
        content += `<iframe src="assets/G/G.pdf"></iframe>`;
    }

    if (section === "H") {
        content += `<iframe src="assets/H/H.pdf"></iframe>`;
    }

    if (section === "I") {
        content += `<iframe src="assets/I/I.pdf"></iframe>`;
    }

    if (section === "J") {
        content += `<iframe src="assets/J/J.pdf"></iframe>`;
    }

    if (section === "K") {
        content += `
        <iframe
            src="https://drive.google.com/file/d/1KKWWft3zxE6SA0sIzZht9-Wei3pidIjV/preview"
            width="100%"
            height="600"
            allow="autoplay">
        </iframe>`;
    }

    document.getElementById("viewer").innerHTML = content;
    document.getElementById("content").style.display = "block";
}

function clearContent() {
    document.getElementById("viewer").innerHTML = "";
    document.getElementById("content").style.display = "none";
}
</script>

</body>
</html>
