<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SM PRIME Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 70px;
    background: #111;
    color: white;
    padding: 10px 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    overflow-y: auto;
}

.sidebar h2 {
    font-size: 11px;
    text-align: center;
    margin: 0 0 10px 0;
    color: #ddd;
}

.menu-item {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #222;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
    font-weight: bold;
    border: 1px solid #444;
}

.menu-item:hover {
    background: #0078ff;
    transform: scale(1.08);
}

/* MAIN */
.main {
    flex: 1;
    position: relative;
    background: black;
}

.cover {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
}

.content {
    position: relative;
    z-index: 2;
    height: 100%;
    overflow-y: auto;
    padding: 20px;
    background: rgba(255,255,255,0.95);
    display: none;
    box-sizing: border-box;
}

.close-btn {
    background: #d32f2f;
    color: white;
    padding: 8px 14px;
    border: none;
    cursor: pointer;
    border-radius: 5px;
    margin-bottom: 10px;
    font-weight: bold;
}

img, iframe {
    width: 100%;
    margin-bottom: 10px;
    border-radius: 6px;
    border: none;
}

iframe {
    height: 600px;
}

@media (max-width: 768px) {
    iframe { height: 500px; }
}

/* mobile detection handled in JS */
</style>
</head>

<body>

<div class="sidebar">
<h2>DOCS</h2>

<div class="menu-item" onclick="loadContent('A')">A</div>
<div class="menu-item" onclick="loadContent('B')">B</div>
<div class="menu-item" onclick="loadContent('C')">C</div>
<div class="menu-item" onclick="loadContent('D')">D</div>
<div class="menu-item" onclick="loadContent('E')">E</div>
<div class="menu-item" onclick="loadContent('F')">F</div>
<div class="menu-item" onclick="loadContent('G')">G</div>
<div class="menu-item" onclick="loadContent('H')">H</div>
<div class="menu-item" onclick="loadContent('I')">I</div>
<div class="menu-item" onclick="loadContent('J')">J</div>
<div class="menu-item" onclick="loadContent('K')">K</div>
</div>

<div class="main">
<img src="assets/cover.jpg" class="cover">

<div id="content" class="content">
<button class="close-btn" onclick="clearContent()">EXIT</button>
<div id="viewer"></div>
</div>
</div>

<script>
function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent);
}

function showPDF(path) {
    if (isIOS()) {
        return `<a href="${path}" target="_blank"
        style="display:block;padding:12px;background:#0078ff;color:white;
        text-align:center;border-radius:6px;margin-bottom:10px;
        text-decoration:none;font-weight:bold;">
        📄 Open PDF
        </a>`;
    }
    return `<iframe src="${path}"></iframe>`;
}

function loadContent(section) {
    let content = "";

    switch(section) {
        case "A":
            for (let i=1;i<=3;i++) {
                content += `<img src="assets/A/${i}.jpg">`;
            }
            break;
        case "B":
            content += showPDF("assets/B/file.pdf");
            break;
        case "C":
            content += showPDF("assets/C/file.pdf");
            break;
        case "D":
            content += showPDF("assets/D/file.pdf");
            break;
        case "E":
            content += `<img src="assets/E/1.jpg">`;
            break;
        case "F":
            content += showPDF("assets/F/F.pdf");
            break;
        case "G":
            content += showPDF("assets/G/G.pdf");
            break;
        case "H":
            content += showPDF("assets/H/H.pdf");
            break;
        case "I":
            content += showPDF("assets/I/I.pdf");
            break;
        case "J":
            content += showPDF("assets/J/J.pdf");
            break;
        case "K":
            content += `<iframe src="https://drive.google.com/file/d/1KKWWft3zxE6SA0sIzZht9-Wei3pidIjV/preview"></iframe>`;
            break;
        default:
            content = "<p>No content found</p>";
    }

    document.getElementById("viewer").innerHTML = content;
    document.getElementById("content").style.display = "block";
}

function clearContent() {
    document.getElementById("viewer").innerHTML = "";
    document.getElementById("content").style.display = "none";
}
</script>

</body>
</html>
