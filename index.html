<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SM PRIME Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 260px;
    background: #111;
    color: white;
    padding: 15px;
    overflow-y: auto;
}

.sidebar h2 {
    text-align: center;
    font-size: 18px;
}

.menu-item {
    padding: 10px;
    margin: 6px 0;
    background: #222;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
    font-size: 13px;
}

.menu-item:hover {
    background: #444;
}

/* MAIN AREA */
.main {
    flex: 1;
    position: relative;
    background: black;
}

/* COVER IMAGE */
.cover {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background-color: black;
}

/* CONTENT */
.content {
    position: relative;
    z-index: 2;
    height: 100%;
    overflow-y: auto;
    padding: 20px;
    background: rgba(255,255,255,0.95);
    display: none;
}

/* EXIT BUTTON */
.close-btn {
    background: red;
    color: white;
    padding: 8px 12px;
    border: none;
    cursor: pointer;
    border-radius: 5px;
    margin-bottom: 10px;
}

/* IMAGES */
img {
    width: 100%;
    margin-bottom: 10px;
    border-radius: 6px;
}

/* PDF */
iframe {
    width: 100%;
    height: 600px;
    margin-bottom: 20px;
    border: none;
}

/* VIDEO */
video {
    width: 100%;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Portfolio</h2>

    <div class="menu-item" onclick="loadContent('A')">A. Endorsement</div>
    <div class="menu-item" onclick="loadContent('B')">B. Nomination</div>
    <div class="menu-item" onclick="loadContent('C')">C. Summary</div>
    <div class="menu-item" onclick="loadContent('D')">D. IPCR</div>
    <div class="menu-item" onclick="loadContent('E')">E. Clearances</div>
    <div class="menu-item" onclick="loadContent('F')">F. Accomplishments</div>
    <div class="menu-item" onclick="loadContent('G')">G. Awards</div>
    <div class="menu-item" onclick="loadContent('H')">H. Innovation</div>
    <div class="menu-item" onclick="loadContent('I')">I. Community</div>
    <div class="menu-item" onclick="loadContent('J')">J. Supporting Docs</div>
    <div class="menu-item" onclick="loadContent('K')">K. Video</div>
</div>

<!-- MAIN -->
<div class="main">

<img src="assets/cover.jpg" class="cover">

<div id="content" class="content">
    <button class="close-btn" onclick="clearContent()">EXIT</button>
    <div id="viewer"></div>
</div>

</div>

<script>
function loadContent(section) {
    let content = "";

    if (section === "A") {
        for (let i = 1; i <= 3; i++) {
            content += `<img src="assets/A/${i}.jpg">`;
        }
    }

    if (section === "B") {
        content += `<iframe src="assets/B/file.pdf"></iframe>`;
    }

    if (section === "C") {
        content += `<iframe src="assets/C/file.pdf"></iframe>`;
    }

    if (section === "D") {
        content += `<iframe src="assets/D/file.pdf"></iframe>`;
    }

    if (section === "E") {
        content += `<img src="assets/E/1.jpg">`;
    }

    /* PDF SECTIONS */
    if (section === "F") {
        content += `<iframe src="assets/F/F.pdf"></iframe>`;
    }

    if (section === "G") {
        content += `<iframe src="assets/G/G.pdf"></iframe>`;
    }

    if (section === "H") {
        content += `<iframe src="assets/H/H.pdf"></iframe>`;
    }

    if (section === "I") {
        content += `<iframe src="assets/I/I.pdf"></iframe>`;
    }

    if (section === "J") {
        content += `<iframe src="assets/J/J.pdf"></iframe>`;
    }

    /* VIDEO SECTION (UPDATED - GOOGLE DRIVE) */
    if (section === "K") {
        content += `
        <iframe 
            src="https://drive.google.com/file/d/1KKWWft3zxE6SA0sIzZht9-Wei3pidIjV/preview"
            width="100%" 
            height="600"
            allow="autoplay">
        </iframe>`;
    }

    document.getElementById("viewer").innerHTML = content;
    document.getElementById("content").style.display = "block";
}

function clearContent() {
    document.getElementById("viewer").innerHTML = "";
    document.getElementById("content").style.display = "none";
}
</script>

</body>
</html>
