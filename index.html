<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SM PRIME Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    height:100vh;
    overflow:hidden;
}

/* FLOATING TOOLBAR */
.toolbar{
    position:fixed;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    z-index:1000;

    display:flex;
    flex-direction:column;
    gap:10px;

    padding:10px;
    border-radius:25px;

    background:rgba(17,17,17,0.65);
    backdrop-filter:blur(8px);
    box-shadow:0 4px 20px rgba(0,0,0,0.3);
}

/* BUTTONS */
.menu-item{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#222;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
    transition:all .25s ease;
    border:1px solid #444;
    user-select:none;
}

.menu-item:hover{
    background:#0078ff;
    transform:scale(1.1);
    border-color:#5aa8ff;
}

.menu-item:active{
    transform:scale(0.95);
}

/* MAIN AREA */
.main{
    position:relative;
    width:100vw;
    height:100vh;
    background:black;
}

/* COVER */
.cover{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:black;
}

/* CONTENT */
.content{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    overflow-y:auto;
    padding:20px 30px 30px 90px;
    background:rgba(255,255,255,0.97);
    display:none;
}

/* EXIT BUTTON */
.close-btn{
    background:#d32f2f;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    margin-bottom:15px;
}

.close-btn:hover{
    background:#b71c1c;
}

/* IMAGES */
img{
    width:100%;
    margin-bottom:12px;
    border-radius:8px;
}

/* PDF */
iframe{
    width:100%;
    height:700px;
    border:none;
    margin-bottom:20px;
}

/* MOBILE */
@media(max-width:768px){

    .toolbar{
        left:8px;
        gap:8px;
        padding:8px;
    }

    .menu-item{
        width:40px;
        height:40px;
        font-size:12px;
    }

    .content{
        padding-left:65px;
    }

    iframe{
        height:500px;
    }
}
</style>
</head>

<body>

<!-- FLOATING TOOLBAR -->
<div class="toolbar">

    <div class="menu-item" title="Endorsement" onclick="loadContent('A')">A</div>

    <div class="menu-item" title="Nomination" onclick="loadContent('B')">B</div>

    <div class="menu-item" title="Summary" onclick="loadContent('C')">C</div>

    <div class="menu-item" title="IPCR" onclick="loadContent('D')">D</div>

    <div class="menu-item" title="Clearances" onclick="loadContent('E')">E</div>

    <div class="menu-item" title="Accomplishments" onclick="loadContent('F')">F</div>

    <div class="menu-item" title="Awards" onclick="loadContent('G')">G</div>

    <div class="menu-item" title="Innovation" onclick="loadContent('H')">H</div>

    <div class="menu-item" title="Community" onclick="loadContent('I')">I</div>

    <div class="menu-item" title="Supporting Docs" onclick="loadContent('J')">J</div>

    <div class="menu-item" title="Video" onclick="loadContent('K')">K</div>

</div>

<!-- MAIN -->
<div class="main">

    <img src="assets/cover.jpg" class="cover" alt="Portfolio Cover">

    <div id="content" class="content">

        <button class="close-btn" onclick="clearContent()">
            EXIT
        </button>

        <div id="viewer"></div>

    </div>

</div>

<script>

function loadContent(section){

    let content = "";

    if(section === "A"){
        for(let i = 1; i <= 3; i++){
            content += `
                <img src="assets/A/${i}.jpg">
            `;
        }
    }

    if(section === "B"){
        content += `
            <iframe src="assets/B/file.pdf"></iframe>
        `;
    }

    if(section === "C"){
        content += `
            <iframe src="assets/C/file.pdf"></iframe>
        `;
    }

    if(section === "D"){
        content += `
            <iframe src="assets/D/file.pdf"></iframe>
        `;
    }

    if(section === "E"){
        content += `
            <img src="assets/E/1.jpg">
        `;
    }

    if(section === "F"){
        content += `
            <iframe src="assets/F/F.pdf"></iframe>
        `;
    }

    if(section === "G"){
        content += `
            <iframe src="assets/G/G.pdf"></iframe>
        `;
    }

    if(section === "H"){
        content += `
            <iframe src="assets/H/H.pdf"></iframe>
        `;
    }

    if(section === "I"){
        content += `
            <iframe src="assets/I/I.pdf"></iframe>
        `;
    }

    if(section === "J"){
        content += `
            <iframe src="assets/J/J.pdf"></iframe>
        `;
    }

    if(section === "K"){
        content += `
        <iframe
            src="https://drive.google.com/file/d/1KKWWft3zxE6SA0sIzZht9-Wei3pidIjV/preview"
            allow="autoplay">
        </iframe>
        `;
    }

    document.getElementById("viewer").innerHTML = content;
    document.getElementById("content").style.display = "block";
}

function clearContent(){
    document.getElementById("viewer").innerHTML = "";
    document.getElementById("content").style.display = "none";
}

</script>

</body>
</html>
